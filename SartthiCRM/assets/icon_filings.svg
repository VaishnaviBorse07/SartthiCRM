<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Compliance Filings">
  <defs>
    <radialGradient id="g_filings" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#g_filings)"/>
  <!-- Clipboard board -->
  <rect x="27" y="28" width="46" height="52" rx="5" fill="white" stroke="white" stroke-width="1"/>
  <!-- Clipboard clip -->
  <rect x="40" y="22" width="20" height="12" rx="4" fill="white"/>
  <circle cx="50" cy="26" r="3" fill="url(#g_filings)"/>
  <!-- Checkmark row -->
  <polyline points="34,44 38,48 46,40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="44" x2="66" y2="44" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Unchecked box 1 -->
  <rect x="33" y="53" width="8" height="8" rx="2" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <line x1="50" y1="57" x2="66" y2="57" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Unchecked box 2 -->
  <rect x="33" y="66" width="8" height="8" rx="2" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <line x1="50" y1="70" x2="66" y2="70" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
