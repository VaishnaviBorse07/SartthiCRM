<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Revenue Growth">
  <defs>
    <linearGradient id="g_growth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#g_growth)"/>
  <!-- Bar 1 (short) -->
  <rect x="20" y="68" width="14" height="14" rx="3" fill="white"/>
  <!-- Bar 2 (medium) -->
  <rect x="38" y="54" width="14" height="28" rx="3" fill="white"/>
  <!-- Bar 3 (tall) -->
  <rect x="56" y="40" width="14" height="42" rx="3" fill="white"/>
  <!-- Growth arrow -->
  <polyline points="22,62 38,48 56,36 74,22" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead -->
  <polygon points="74,22 64,20 72,30" fill="white"/>
</svg>
