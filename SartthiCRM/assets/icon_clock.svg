<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="On-Time Filing">
  <defs>
    <linearGradient id="g_clock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#g_clock)"/>
  <!-- Clock ring (open at top-right for checkmark) -->
  <path d="M50 22 A28 28 0 1 0 74 38" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Clock hands -->
  <line x1="50" y1="50" x2="50" y2="36" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="62" y2="50" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2.5" fill="white"/>
  <!-- Checkmark (top-right area) -->
  <polyline points="68,28 74,36 82,22" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock dots -->
  <circle cx="50" cy="26" r="2" fill="white"/>
  <circle cx="74" cy="50" r="2" fill="white"/>
  <circle cx="50" cy="74" r="2" fill="white"/>
  <circle cx="26" cy="50" r="2" fill="white"/>
</svg>
