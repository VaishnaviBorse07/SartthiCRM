<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Retail Businesses">
  <defs>
    <radialGradient id="g_store" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#g_store)"/>
  <!-- Store facade - columns -->
  <line x1="30" y1="53" x2="30" y2="78" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="53" x2="70" y2="78" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Ground bar -->
  <line x1="26" y1="78" x2="74" y2="78" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Door -->
  <rect x="43" y="60" width="14" height="18" rx="2" fill="white" opacity="0.3" stroke="white" stroke-width="2"/>
  <circle cx="55" cy="69" r="1.5" fill="white"/>
  <!-- Shopfront window -->
  <rect x="31" y="57" width="10" height="12" rx="2" fill="white" opacity="0.25" stroke="white" stroke-width="2"/>
  <!-- Window shine -->
  <line x1="33" y1="59" x2="35" y2="63" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <rect x="59" y="57" width="10" height="12" rx="2" fill="white" opacity="0.25" stroke="white" stroke-width="2"/>
  <!-- Awning -->
  <path d="M24 53 Q50 40 76 53" fill="white"/>
  <!-- Awning stripes -->
  <line x1="32" y1="48" x2="26" y2="53" stroke="url(#g_store)" stroke-width="3"/>
  <line x1="41" y1="43" x2="36" y2="53" stroke="url(#g_store)" stroke-width="3"/>
  <line x1="50" y1="41" x2="47" y2="53" stroke="url(#g_store)" stroke-width="3"/>
  <line x1="59" y1="43" x2="58" y2="53" stroke="url(#g_store)" stroke-width="3"/>
  <line x1="68" y1="48" x2="68" y2="53" stroke="url(#g_store)" stroke-width="3"/>
  <!-- Awning frame top line -->
  <line x1="24" y1="53" x2="76" y2="53" stroke="white" stroke-width="2"/>
  <path d="M24 53 Q50 40 76 53" fill="none" stroke="white" stroke-width="2"/>
</svg>
