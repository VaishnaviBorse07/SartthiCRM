<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In & Register – SartthiCRM</title>
<meta name="description" content="Sign in or create your SartthiCRM account. Start your free 14-day trial today.">
<link rel="stylesheet" href="styles.css">
<style>
body { background:linear-gradient(135deg,var(--sky-ll) 0%,white 50%,var(--yellow-ll) 100%);
  min-height:100vh; }
.auth-wrap { min-height:100vh; display:flex; align-items:center;
  justify-content:center; padding:100px 20px 40px; }
.auth-card { background:white; border-radius:28px; border:1px solid var(--g200);
  box-shadow:var(--sh-xl); width:100%; max-width:460px;
  overflow:hidden; position:relative; }
.auth-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,var(--sky),var(--yellow)); }
.auth-inner { padding:40px; }
.auth-logo { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:32px; }
.auth-logo-icon { width:38px; height:38px; border-radius:12px;
  background:linear-gradient(135deg,var(--sky),var(--sky-d));
  display:flex; align-items:center; justify-content:center; box-shadow:var(--sh-sky); }
.auth-logo-icon svg { width:20px; height:20px; }
.auth-logo-text { font-family:var(--fb); font-size:1.4rem; font-weight:800; color:var(--navy); }
.auth-logo-text span { color:var(--sky); }
.auth-tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--g100);
  border-radius:12px; padding:4px; gap:4px; margin-bottom:32px; }
.auth-tab { padding:10px; border-radius:9px; font-size:.88rem; font-weight:600;
  text-align:center; cursor:pointer; transition:all .25s; color:var(--g500);
  background:transparent; font-family:var(--fb); border:none; }
.auth-tab.on { background:white; color:var(--navy); box-shadow:var(--sh-sm); }
.auth-title { font-size:1.3rem; font-weight:700; color:var(--navy); margin-bottom:6px; }
.auth-sub { font-size:.84rem; color:var(--g500); margin-bottom:28px; }
.form-panel { display:none; }
.form-panel.active { display:block; }
.form-input-icon { position:relative; }
.form-input-icon input { padding-left:40px; }
.fii { position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:1rem; pointer-events:none; }
.auth-divider { display:flex; align-items:center; gap:12px; margin:20px 0;
  color:var(--g400); font-size:.78rem; font-weight:600; }
.auth-divider::before,.auth-divider::after { content:''; flex:1; height:1px; background:var(--g200); }
.btn-google { width:100%; padding:12px; border-radius:11px; font-size:.88rem;
  font-weight:600; border:1.5px solid var(--g200); cursor:pointer;
  background:white; color:var(--navy); font-family:var(--fb);
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:all .25s; }
.btn-google:hover { border-color:var(--sky); box-shadow:var(--sh-sm); }
.auth-footer { text-align:center; font-size:.8rem; color:var(--g500);
  margin-top:20px; }
.auth-footer a { color:var(--sky); font-weight:600; }
.form-submit-auth { width:100%; padding:13px; border-radius:100px;
  font-size:.94rem; font-weight:700; background:var(--sky);
  color:white; border:none; cursor:pointer; font-family:var(--fb);
  box-shadow:var(--sh-sky); transition:all .3s; margin-top:4px; }
.form-submit-auth:hover { background:var(--sky-d); transform:translateY(-2px); }
.product-select { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
.ps-btn { padding:10px 8px; border-radius:10px; border:1.5px solid var(--g200);
  font-size:.72rem; font-weight:600; cursor:pointer; background:white;
  text-align:center; transition:all .25s; font-family:var(--fb); color:var(--navy); }
.ps-btn:hover,.ps-btn.on { border-color:var(--sky); background:var(--sky-ll); color:var(--sky-dd); }
.ps-btn span { display:block; font-size:1.2rem; margin-bottom:4px; }
</style>
</head>
<body>
<script src="nav.js" defer></script>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-inner">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
        <div class="auth-logo-text">Sartthi<span>CRM</span></div>
      </div>
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab on" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- SIGN IN -->
      <div class="form-panel active" id="panel-signin">
        <div class="auth-title">Welcome back! <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></div>
        <div class="auth-sub">Sign in to your SartthiCRM account.</div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="form-input-icon"><span class="fii"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input class="form-input" type="email" id="si-email" placeholder="you@company.com"></div>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between">Password <a href="#" style="color:var(--sky);font-size:.75rem">Forgot password?</a></label>
          <div class="form-input-icon"><span class="fii">🔒</span><input class="form-input" type="password" id="si-pass" placeholder="••••••••"></div>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="si-rem" style="width:16px;height:16px;accent-color:var(--sky)">
          <label for="si-rem" style="font-size:.82rem;color:var(--g600);cursor:pointer">Keep me signed in</label>
        </div>
        <button class="form-submit-auth" onclick="handleSignIn()">Sign In →</button>
        <div class="auth-divider">or</div>
        <button class="btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <div class="auth-footer">Don't have an account? <a href="#" onclick="switchTab('register')">Register free →</a></div>
      </div>

      <!-- REGISTER -->
      <div class="form-panel" id="panel-register">
        <div class="auth-title">Start your free trial <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></div>
        <div class="auth-sub">14 days free. No credit card required.</div>
        <div class="form-group">
          <label class="form-label">Select Your CRM Product</label>
          <div class="product-select">
            <button class="ps-btn on" onclick="selectProduct(this)"><span><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>IT Sales & Support</button>
            <button class="ps-btn" onclick="selectProduct(this)"><span><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v17"/><path d="M5 20h14"/><path d="M22 8h-4l-3-5H9L6 8H2"/><path d="M2 8l2 6h16l2-6"/></svg></span>CA Practice Manager</button>
            <button class="ps-btn" onclick="selectProduct(this)"><span><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Retail & Distribution</button>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">First Name *</label><input class="form-input" type="text" id="rg-fn" placeholder="Saurabh"></div>
          <div class="form-group"><label class="form-label">Last Name *</label><input class="form-input" type="text" id="rg-ln" placeholder="Wagh"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Business Email *</label>
          <div class="form-input-icon"><span class="fii"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input class="form-input" type="email" id="rg-email" placeholder="you@company.com"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Phone / WhatsApp *</label>
          <div class="form-input-icon"><span class="fii"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></span><input class="form-input" type="tel" id="rg-phone" placeholder="+91 98765 43210"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Company Name *</label>
          <input class="form-input" type="text" id="rg-company" placeholder="Your Company Pvt. Ltd.">
        </div>
        <div class="form-group">
          <label class="form-label">Password *</label>
          <div class="form-input-icon"><span class="fii">🔒</span><input class="form-input" type="password" id="rg-pass" placeholder="Create a strong password"></div>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-start;gap:8px">
          <input type="checkbox" id="rg-terms" style="width:16px;height:16px;margin-top:2px;accent-color:var(--sky)">
          <label for="rg-terms" style="font-size:.78rem;color:var(--g600);cursor:pointer;line-height:1.5">I agree to the <a href="#" style="color:var(--sky)">Terms of Service</a> and <a href="#" style="color:var(--sky)">Privacy Policy</a></label>
        </div>
        <button class="form-submit-auth" onclick="handleRegister()">Create Free Account →</button>
        <div class="auth-divider">or</div>
        <button class="btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign up with Google
        </button>
        <div class="auth-footer">Already have an account? <a href="#" onclick="switchTab('signin')">Sign in →</a></div>
      </div>

    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  ['signin','register'].forEach(t => {
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('on', t===tab);
  });
}

function selectProduct(btn) {
  document.querySelectorAll('.ps-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function handleSignIn() {
  const email = document.getElementById('si-email').value;
  const pass = document.getElementById('si-pass').value;
  if (!email || !pass) { showToast('<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Please fill in email and password'); return; }
  showToast('<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Signing you in… Welcome back!');
  setTimeout(() => window.location.href = 'index.html', 1500);
}

function handleRegister() {
  const fn = document.getElementById('rg-fn').value;
  const email = document.getElementById('rg-email').value;
  const phone = document.getElementById('rg-phone').value;
  const company = document.getElementById('rg-company').value;
  const pass = document.getElementById('rg-pass').value;
  const terms = document.getElementById('rg-terms').checked;
  if (!fn || !email || !phone || !company || !pass) { showToast('<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Please fill all required fields'); return; }
  if (!terms) { showToast('<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Please accept Terms of Service'); return; }
  showToast('🎉 Account created! Welcome to SartthiCRM!');
  setTimeout(() => window.location.href = 'index.html', 1500);
}

function handleGoogle() { showToast('<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Redirecting to Google Sign In…'); }

// Check if opened with #register hash
window.addEventListener('load', () => {
  if (location.hash === '#register') switchTab('register');
});
</script>
</body>
</html>
